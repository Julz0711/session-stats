name: Probe
on:
  push:
    branches: [ci-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew compileJava compileGametestJava || true
      - name: Inspect classes
        run: |
          CP=$(find ~/.gradle /home/runner/work -name '*.jar' 2>/dev/null | grep -v -e sources -e wrapper | tr '\n' ':')
          while read -r c; do
            echo "===== $c"
            javap -cp "$CP" "$c" 2>&1 | grep -v '^Compiled from' | sed 's/^/  /'
          done < probe-classes.txt
